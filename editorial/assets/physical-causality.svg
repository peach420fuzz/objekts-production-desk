<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1500" viewBox="0 0 1000 1500" role="img" aria-labelledby="title desc">
<title id="title">Direct Cause, Visible Effect — objekts physical action grammar</title>
<desc id="desc">Five readable action phases arranged vertically: contact, force, motion, material lag and reaction. A frame must show cause before effect.</desc>
<rect width="1000" height="1500" fill="#F3F0E8"/>
<rect x="58" y="54" width="884" height="5" fill="#111820"/>
<text x="58" y="108" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="3">OBJEKTS FIELD NOTES  /  02</text>
<text x="58" y="222" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">DIRECT CAUSE.</text>
<text x="58" y="312" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="82" font-weight="800" letter-spacing="-3">VISIBLE EFFECT.</text>
<text x="60" y="375" fill="#445159" font-family="Arial,Helvetica,sans-serif" font-size="27">A shot is a sequence of evidence, not a mood.</text>
<rect x="58" y="433" width="884" height="817" fill="#FFFFFF" stroke="#1E252C" stroke-width="3"/>
<path d="M140 512 V1145" fill="none" stroke="#244A6A" stroke-width="6"/>
<g font-family="Arial,Helvetica,sans-serif">
<circle cx="140" cy="524" r="29" fill="#244A6A"/><text x="140" y="533" fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle">1</text>
<text x="208" y="515" fill="#101820" font-size="37" font-weight="700">CONTACT</text>
<text x="208" y="554" fill="#45545E" font-size="23">Hand/tool meets the object.</text>
<line x1="208" y1="580" x2="900" y2="580" stroke="#CFD4D6" stroke-width="2"/>
<circle cx="140" cy="654" r="29" fill="#244A6A"/><text x="140" y="663" fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle">2</text>
<text x="208" y="645" fill="#101820" font-size="37" font-weight="700">FORCE</text>
<text x="208" y="684" fill="#45545E" font-size="23">Visible load path, pressure, grip.</text>
<line x1="208" y1="710" x2="900" y2="710" stroke="#CFD4D6" stroke-width="2"/>
<circle cx="140" cy="784" r="29" fill="#244A6A"/><text x="140" y="793" fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle">3</text>
<text x="208" y="775" fill="#101820" font-size="37" font-weight="700">MOTION</text>
<text x="208" y="814" fill="#45545E" font-size="23">Direction, inertia, scale, axis.</text>
<line x1="208" y1="840" x2="900" y2="840" stroke="#CFD4D6" stroke-width="2"/>
<circle cx="140" cy="914" r="29" fill="#244A6A"/><text x="140" y="923" fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle">4</text>
<text x="208" y="905" fill="#101820" font-size="37" font-weight="700">MATERIAL LAG</text>
<text x="208" y="944" fill="#45545E" font-size="23">Cloth, dust or suspension settles.</text>
<line x1="208" y1="970" x2="900" y2="970" stroke="#CFD4D6" stroke-width="2"/>
<circle cx="140" cy="1044" r="29" fill="#244A6A"/><text x="140" y="1053" fill="#FFFFFF" font-size="25" font-weight="700" text-anchor="middle">5</text>
<text x="208" y="1035" fill="#101820" font-size="37" font-weight="700">REACTION</text>
<text x="208" y="1074" fill="#45545E" font-size="23">Human payoff, then editorial hold.</text>
<rect x="89" y="1134" width="823" height="78" fill="#E8EFE9"/>
<text x="115" y="1181" fill="#265F46" font-size="25" font-weight="700">RULE: THE CONSEQUENCE FOLLOWS THE CAUSE.</text>
</g>
<text x="58" y="1308" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">CHECK THE MOTION BETWEEN ENDPOINTS.</text>
<text x="58" y="1352" fill="#45545E" font-family="Arial,Helvetica,sans-serif" font-size="22">Pretty first and last frames can hide a broken collision.</text>
<rect x="58" y="1371" width="884" height="3" fill="#111820"/>
<text x="58" y="1421" fill="#111820" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">objekts.ai</text>
<text x="942" y="1421" fill="#3D4950" text-anchor="end" font-family="Arial,Helvetica,sans-serif" font-size="21">BLOCKING  /  FORCE  /  EDIT</text>
<text x="58" y="1462" fill="#65737B" font-family="Arial,Helvetica,sans-serif" font-size="17">Original educational diagram. No client boards or figures reproduced.</text>
</svg>