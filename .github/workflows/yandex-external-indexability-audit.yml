name: objekts | Yandex external indexability audit
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/yandex-external-indexability-audit.yml
      - ops/yandex_indexability_audit.py
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check indexability with YandexBot-like and browser user agents
        shell: bash
        env:
          AUDIT_ALL: "1"
        run: python3 ops/yandex_indexability_audit.py
