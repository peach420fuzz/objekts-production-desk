name: "objekts | AI buyer findability (read-only)"

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * *"
  push:
    paths:
      - ".github/workflows/ai-buyer-findability.yml"
      - "ops/agent_buying_journey_probe.py"
      - "references/AI_VENDOR_FIT_EVIDENCE.md"
      - "references/ai-vendor-fit-evidence.json"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: objekts-role12-agent-buying-findability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate assertions without external requests
        run: python3 ops/agent_buying_journey_probe.py --offline-test
      - name: Check live discovery, case evidence and optional consent-based contact
        run: python3 ops/agent_buying_journey_probe.py --ci --output out/agent-buyer-findability.json
      - name: Keep exact status codes for review (short retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role12-agent-buyer-findability
          path: out/agent-buyer-findability.json
          if-no-files-found: ignore
          retention-days: 3
