name: "objekts | AI buyer findability (read-only)"

on:
  workflow_dispatch:
  schedule:
    - cron: "13 8 * * *"
  push:
    paths:
      - ".github/workflows/ai-buyer-findability.yml"
      - "ops/agent_buying_journey_probe.py"
      - "ops/mcp_protocol_era_probe.py"
      - "ops/role12/**"
      - "references/AI_VENDOR_FIT_EVIDENCE.md"
      - "references/ai-vendor-fit-evidence.json"
      - "AGENTS.md"

permissions:
  contents: read

concurrency:
  group: objekts-role12-agent-buying-findability
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate assertions without external requests
        run: python3 ops/agent_buying_journey_probe.py --offline-test
      - name: Check live discovery, case evidence and optional consent-based contact
        run: python3 ops/agent_buying_journey_probe.py --ci --output out/agent-buyer-findability.json
      - name: Validate protocol parser (offline)
        run: python3 ops/mcp_protocol_era_probe.py --offline-test
      - name: Audit modern and legacy MCP capability discovery (read-only)
        run: python3 ops/mcp_protocol_era_probe.py
      - name: Guard against cross-subdomain crawler false alarms
        shell: bash
        run: |
          mkdir -p out
          python3 ops/role12/host_scoped_crawlers.py --self-test
          python3 ops/role12/host_scoped_crawlers.py --input ops/role12/fixtures/oai_searchbot_2026-10-18.json > out/role12-oai-hosts.json
          python3 -c 'import json; v=json.load(open("out/role12-oai-hosts.json")); x={r["host"]:r for r in v}; assert x["objekts.ai"]["codes"]=={"200":3}; assert x["media.objekts.ai"]["codes"]=={"301":1,"404":2}; print("PASS: OAI-SearchBot root-only status gate")'
      - name: Keep exact status codes for review (short retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: role12-agent-buyer-findability
          path: |
            out/agent-buyer-findability.json
            out/mcp_protocol_era.json
            out/role12-oai-hosts.json
          if-no-files-found: ignore
          retention-days: 3
