name: objekts | Neuronto ARD commercial discovery audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify official ARD publication
        run: |
          curl -fsSL --max-time 20 -A 'Mozilla/5.0' https://objekts.ai/.well-known/ard.json | python3 -c 'import sys,json; d=json.load(sys.stdin); assert d["specVersion"]=="1.0" and len(d["entries"])==4; print("ARD verified:",len(d["entries"]))'
      - name: Link to source-specific submitted audit
        run: |
          echo 'Accepted: https://github.com/peach420fuzz/objekts-production-desk/actions/runs/39064558779'
          echo 'Rechecked: https://github.com/peach420fuzz/objekts-production-desk/actions/runs/39064691930'
