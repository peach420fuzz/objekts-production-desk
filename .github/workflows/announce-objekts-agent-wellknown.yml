name: objekts | Announce canonical A2A publisher to Wellknown
on:
  push:
    paths:
      - ".github/workflows/announce-objekts-agent-wellknown.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  announce:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify source catalog and log remote accessibility
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          url="https://raw.githubusercontent.com/peach420fuzz/objekts-production-desk/main/distribution/ard.json"
          with urllib.request.urlopen(url,timeout=20) as response:
              doc=json.load(response)
          assert len(doc.get("entries",[]))==4
          print("Verified four-entry domain ARD source at GitHub")
          PY
          for url in https://objekts.ai/.well-known/ard.json https://objekts.ai/.well-known/agent-card.json; do
            echo "Remote HEAD ($url):"
            curl -sSIL --max-time 12 -A 'Mozilla/5.0 (compatible; AgentCatalogVerification/1.0)' "$url" | grep -iE '^HTTP/|^cf-mitigated:' | tail -3 || true
          done
      - name: Submit existing canonical A2A Agent Card; reuse duplicate record when recognized
        shell: bash
        run: |
          set -euo pipefail
          echo '{"cardUrl":"https://objekts.ai/.well-known/agent-card.json"}' > payload.json
          code=$(curl -sS --max-time 35 -o response.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            -X POST https://wellknown.network/api/v1/submit --data-binary @payload.json)
          echo "Wellknown submit HTTP status: $code"
          python3 - <<'PY'
          import json
          try:
              doc=json.load(open("response.json"))
          except Exception as exc:
              print("Could not decode response:",str(exc))
              raise
          for k in ["status","agentId","agent","id","duplicate","claimUrl","recordUrl","message","error"]:
              if k in doc:
                  print(k,":",str(doc[k])[:450])
          print("Response fields:",list(doc)[:18])
          PY
          case "$code" in
            200|201|202|409) ;;
            *) echo "Submission not accepted" >&2; exit 1;;
          esac
