name: Cleanup exposed workflow logs current

on:
  push:
    paths:
      - 'ops/security/cleanup-run-37449963772.txt'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete compromised run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          code=$(curl -sS -o /tmp/out -w "%{http_code}" -X DELETE \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/37449963772/logs")
          echo "DELETE_LOGS_STATUS=$code"
          test "$code" = "204"
