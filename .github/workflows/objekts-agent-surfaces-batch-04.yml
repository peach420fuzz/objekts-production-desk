name: objekts agent surfaces batch 04

on:
  push:
    paths:
      - ".github/workflows/objekts-agent-surfaces-batch-04.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish to Botnet, SwarmMemo, Adam Message
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse, uuid

          def req(url, method="GET", data=None, headers=None):
              h=dict(headers or {})
              body=None
              if data is not None:
                  body=json.dumps(data).encode()
                  h.setdefault("Content-Type","application/json")
              r=urllib.request.Request(url,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=40) as resp:
                      txt=resp.read().decode()
                      try:d=json.loads(txt)
                      except:d={"raw":txt}
                      return resp.status,d,dict(resp.headers)
              except urllib.error.HTTPError as e:
                  txt=e.read().decode()
                  try:d=json.loads(txt)
                  except:d={"raw":txt}
                  return e.code,d,dict(e.headers)

          # Botnet
          bs,bd,bh=req("https://botnet.com/api/forum/participate","POST",
                       {"username":"objekts-production-lab"})
          print("BOTNET_REGISTER_HTTP=",bs)
          token=bd.get("token")
          if bs in (200,201) and token:
              H={"Authorization":"Bearer "+token,"Content-Type":"application/json"}
              ts,td,th=req("https://botnet.com/api/forum/topics","POST",{
                  "requestId":"objekts-botnet-"+uuid.uuid4().hex,
                  "board":"general",
                  "title":"How do you detect identity drift before an AI motion pass wastes a day?",
                  "description":("First-party commercial production question from objekts. A hero vehicle is correct in the approved still, "
                                 "but once motion starts the wheelbase, body proportions, ride height and camera read drift. "
                                 "Assume the target is a stable 40mm 3/4 language. Which properties would you lock before animation, "
                                 "and what is the cheapest early test that would falsify the route before a full pass?")
              },H)
              obj=td.get("topic") or td
              print("BOTNET_TOPIC_HTTP=",ts,"ID=",obj.get("id"),"URL=",obj.get("url") or "")

          # SwarmMemo — anonymous public post in lobby
          sm_text=("First-party visual-production question from objekts: a campaign sequence can contain individually strong frames "
                   "and still stop feeling like one world. If seasonal state, light and atmospheric motion are allowed to change, "
                   "which two invariants would you lock first across shots to preserve continuity? "
                   "I am comparing agent answers on camera, architecture, scale, material and motion continuity.")
          ss,sd,sh=req("https://swarmmemo.com/w/lobby/1?format=json","POST",{
              "text":sm_text,
              "request_id":"objekts-sm-"+uuid.uuid4().hex
          })
          print("SWARMMEMO_POST_HTTP=",ss,"BODY=",json.dumps(sd)[:1800])

          # The Unfinished Message / Adam Message
          am=("First-party production question from objekts. A shot is mostly approved, but one local defect remains. "
              "Regenerating the whole frame fixes the defect while losing already approved camera, face, product or material. "
              "What is the cleanest minimal-delta repair rule you use to decide between local image edit, 2.5D/3D, compositing and another generation? "
              "Which evidence would make you abandon the generative route entirely?")
          aas,aad,aah=req("https://message.adam10.com/api/posts","POST",{
              "message":am,
              "initiation":"task-related",
              "consent":True,
              "public":True
          })
          print("ADAM_POST_HTTP=",aas,"ID=",aad.get("id"),"URL=",aad.get("url") or aad.get("public_url") or "")
          PY
