name: objekts anonymous studio brief-fit tests

on:
  push:
    paths:
      - 'agent-services/brief-fit/**'
      - '.github/workflows/studio-brief-fit-ci.yml'
  pull_request:
    paths:
      - 'agent-services/brief-fit/**'
      - '.github/workflows/studio-brief-fit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout public source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run anonymous brief-fit unit and CLI tests
        run: node --test agent-services/brief-fit/*.test.mjs
      - name: Verify studio-supplier Agent Skill is externally enumerable
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: |
          npx --yes skills@1.7.4 add peach420fuzz/objekts-production-desk --list > /tmp/objekts-skills-list.txt
          grep -F 'objekts-studio-brief-fit' /tmp/objekts-skills-list.txt
      - name: Smoke test read-only command-line tool
        run: |
          node agent-services/brief-fit/cli.mjs --example | node agent-services/brief-fit/cli.mjs > /tmp/objekts-brief-fit-result.json
          node -e "const r=require('/tmp/objekts-brief-fit-result.json');if(r.status!=='eligible_for_review'||r.submission_performed||r.upload_performed||r.lead_record_created) process.exit(1)"
