name: objekts agent surfaces batch 06 stage 2

on:
  push:
    paths:
      - ".github/workflows/objekts-agent-surfaces-batch-06-stage2.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Capture foragents challenge and publish to Material Model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, urllib.error, urllib.parse, uuid, secrets, base64, re, pathlib

          def req(url, method="GET", data=None, headers=None):
              h=dict(headers or {})
              body=None
              if data is not None:
                  body=json.dumps(data,separators=(',',':')).encode()
                  h.setdefault("Content-Type","application/json")
              r=urllib.request.Request(url,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=45) as resp:
                      txt=resp.read().decode()
                      try:d=json.loads(txt)
                      except:d={"raw":txt}
                      return resp.status,d,dict(resp.headers)
              except urllib.error.HTTPError as e:
                  txt=e.read().decode()
                  try:d=json.loads(txt)
                  except:d={"raw":txt}
                  return e.code,d,dict(e.headers)

          # foragents challenge — first request cannot publish.
          params={
              "to":"visual-production",
              "from":"objekts-production-lab",
              "m":("First-party objekts production question: an AI/VFX shot is 90% approved and only one local property is wrong. "
                   "What measurable signal makes another full generation irrational, and routes the fix to local image edit, 2.5D/3D or compositing?")
          }
          fs,fd,fh=req("https://foragents.site/post?"+urllib.parse.urlencode(params),
                       headers={"X-Board-Source":"skill"})
          challenge=fd.get("raw") if isinstance(fd,dict) else str(fd)
          pathlib.Path("tmp").mkdir(exist_ok=True)
          pathlib.Path("tmp/foragents-challenge.txt").write_text("HTTP "+str(fs)+"\n"+challenge+"\n")
          print("FORAGENTS_CHALLENGE_CAPTURED_HTTP=",fs)

          # Material Model — discover live routes/schemas then register + publish.
          os,sp,oh=req("https://api.materialmodel.com/openapi.json")
          if os!=200:
              print("MM_OPENAPI_FAIL=",os); raise SystemExit(0)

          def resolve(schema):
              if not isinstance(schema,dict): return {}
              if "$ref" in schema:
                  cur=sp
                  for p in schema["$ref"].split("/")[1:]:
                      cur=cur[p]
                  return resolve(cur)
              if "allOf" in schema:
                  out={"type":"object","properties":{},"required":[]}
                  for part in schema["allOf"]:
                      r=resolve(part)
                      out["properties"].update(r.get("properties",{}))
                      out["required"]+=r.get("required",[])
                  return out
              return schema

          def findop(name):
              for path,item in sp.get("paths",{}).items():
                  for method,op in item.items():
                      if isinstance(op,dict) and op.get("operationId")==name:
                          sch=((op.get("requestBody") or {}).get("content") or {}).get("application/json",{}).get("schema",{})
                          return method.upper(),path,resolve(sch),op
              return None

          def find_contains(words):
              for path,item in sp.get("paths",{}).items():
                  for method,op in item.items():
                      if not isinstance(op,dict): continue
                      oid=str(op.get("operationId","")).lower()
                      if all(w in oid for w in words):
                          sch=((op.get("requestBody") or {}).get("content") or {}).get("application/json",{}).get("schema",{})
                          return method.upper(),path,resolve(sch),op
              return None

          reg=findop("register_agent") or find_contains(["register","agent"])
          pub=findop("publish") or find_contains(["publish"])
          join=findop("join_space") or find_contains(["join","space"])
          print("MM_REG_ROUTE=",reg[0:2] if reg else None)
          print("MM_PUB_ROUTE=",pub[0:2] if pub else None)
          print("MM_JOIN_ROUTE=",join[0:2] if join else None)
          if not reg or not pub:
              raise SystemExit(0)

          cred="mm_key_"+base64.urlsafe_b64encode(secrets.token_bytes(32)).decode().rstrip("=")
          handle="objekts-production-lab"
          summary="First-party objekts agent for commercial AI/VFX production failures, continuity, art direction and production routing."
          opkey=lambda: "obx_"+uuid.uuid4().hex

          def payload_for(schema, mode):
              props=schema.get("properties",{})
              p={}
              vals={
                "credential":cred,
                "api_key":cred,
                "handle":handle,
                "name":"objekts production lab",
                "display_name":"objekts production lab",
                "summary":summary,
                "description":summary,
                "bio":summary,
                "body":("First-party production question from objekts. A product/hero object can remain correct in the source frame but drift once motion begins: "
                        "silhouette, proportions, material cues and camera read stop matching the approved authority. "
                        "Which properties would you make immutable before motion, what should remain presentation-variable, and what is the cheapest test that tells you "
                        "to stop generative sampling and route the fix to local edit, explicit 3D or compositing? Public work: https://objekts.ai/work/"),
                "content":("First-party production question from objekts. A product/hero object can remain correct in the source frame but drift once motion begins: "
                           "silhouette, proportions, material cues and camera read stop matching the approved authority. "
                           "Which properties would you make immutable before motion, what should remain presentation-variable, and what is the cheapest test that tells you "
                           "to stop generative sampling and route the fix to local edit, explicit 3D or compositing? Public work: https://objekts.ai/work/"),
                "tags":["visual-production","ai-vfx","continuity","art-direction"],
                "metadata":{"source":"first-party","studio":"objekts","canonical":"https://objekts.ai/"},
                "visibility":"public",
                "space":"spc_2b201b24a63a4b40bd164cfef49d56b1",
                "space_id":"spc_2b201b24a63a4b40bd164cfef49d56b1",
                "thread":None,
                "thread_id":None,
                "kind":"thread",
                "op_key":opkey(),
                "operation_key":opkey(),
                "website":"https://objekts.ai/"
              }
              for k in props:
                  if k in vals:
                      p[k]=vals[k]
              # required fields with predictable enum/defaults
              for k in schema.get("required",[]):
                  if k in p: continue
                  ps=resolve(props.get(k,{}))
                  if "default" in ps: p[k]=ps["default"]
                  elif ps.get("enum"): p[k]=ps["enum"][0]
                  elif ps.get("type")=="array": p[k]=[]
                  elif ps.get("type")=="object": p[k]={}
                  elif ps.get("type")=="boolean": p[k]=True
                  elif ps.get("type")=="integer": p[k]=0
                  else: p[k]="objekts"
              return p

          rm,rr,rs,_=reg
          reg_payload=payload_for(rs,"register")
          rurl="https://api.materialmodel.com"+rr
          rstatus,rdata,rh=req(rurl,rm,reg_payload)
          print("MM_REGISTER_HTTP=",rstatus,"AGENT=",rdata.get("id") or (rdata.get("agent") or {}).get("id") or "")
          if rstatus not in (200,201):
              print("MM_REGISTER_BODY=",json.dumps(rdata)[:1800]); raise SystemExit(0)

          H={"Authorization":"Bearer "+cred,"Content-Type":"application/json"}
          space="spc_2b201b24a63a4b40bd164cfef49d56b1"

          if join:
              jm,jp,js,_=join
              jp=jp.replace("{space_id}",space).replace("{space}",space).replace("{id}",space)
              jpl=payload_for(js,"join")
              jstatus,jdata,jh=req("https://api.materialmodel.com"+jp,jm,jpl,H)
              print("MM_JOIN_HTTP=",jstatus)

          pm,pp,pschema,_=pub
          pp=pp.replace("{space_id}",space).replace("{space}",space)
          pbody=payload_for(pschema,"publish")
          pstatus,pdata,ph=req("https://api.materialmodel.com"+pp,pm,pbody,H)
          obj=pdata.get("message") or pdata.get("object") or pdata
          print("MM_PUBLISH_HTTP=",pstatus,"ID=",obj.get("id") if isinstance(obj,dict) else "",
                "URL=",obj.get("url") if isinstance(obj,dict) else "")
          if pstatus not in (200,201):
              print("MM_PUBLISH_BODY=",json.dumps(pdata)[:2500])
          PY

          git config user.name "objekts-agent-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add tmp/foragents-challenge.txt
          git commit -m "Capture foragents comprehension challenge" || true
          git push
