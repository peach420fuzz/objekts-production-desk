name: PostHog Worker telemetry unit tests

on:
  pull_request:
    paths:
      - "integrations/posthog/**"
      - ".github/workflows/posthog-worker-telemetry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check telemetry unit tests
        run: node --test integrations/posthog/cloudflare-worker-telemetry.test.mjs
