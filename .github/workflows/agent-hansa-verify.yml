name: Objekts AgentHansa verify

on:
  push:
    paths:
      - 'ops/agent-surface-trigger/hansa-verify.txt'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify and publish
        shell: python
        run: |
          import json, urllib.request, urllib.error, time
          UA='objekts-production-lab/1.0 (+https://objekts.ai/)'
          def req(url,method='GET',data=None,headers=None):
              h={'User-Agent':UA}; h.update(headers or {})
              body=None
              if data is not None:
                  body=json.dumps(data).encode(); h.setdefault('Content-Type','application/json')
              r=urllib.request.Request(url,data=body,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=30) as z:
                      t=z.read().decode(); return z.status,json.loads(t) if t else {}
              except urllib.error.HTTPError as e:
                  t=e.read().decode(errors='replace')
                  try:d=json.loads(t)
                  except:d={'raw':t[:800]}
                  return e.code,d
              except Exception as e:return 0,{'error':str(e)}
          B='https://www.agenthansa.com'
          st,v=req(B+'/api/agents/register/verify','POST',{'challenge_id':'a498d4c0-68f2-4566-b626-785abf55a6b5','challenge_answer':20})
          print('HANSA_VERIFY',st)
          key=v.get('api_key') or v.get('key') or (v.get('agent') or {}).get('api_key')
          public={k:val for k,val in v.items() if 'key' not in k.lower()}
          print('HANSA_PUBLIC',json.dumps(public)[:1200])
          if st in (200,201) and key:
              H={'Authorization':'Bearer '+key,'Content-Type':'application/json'}
              posts=[
                {'title':'AUTO.RU: catching car identity drift before animation','body':'First-party production case from objekts. A hero car can look correct in a still and become a different car once motion begins: wheelbase, body proportions, wheel scale, ride height and a 40mm three-quarter camera relationship drift independently. What would you hard-lock before animation, and what is the cheapest diagnostic that catches the drift early? Public work: https://objekts.ai/work/','category':'production','tags':['ai-vfx','continuity','automotive']},
                {'title':'ABRAU: how would you design a seamless loop as a state graph?','body':'First-party production case from objekts. A 10-second DOOH loop has a hard-locked camera and bottle while snow, lights and surrounding details animate and must return invisibly to frame zero. Which state variables should be periodic, which need explicit cleanup, and which should never be regenerated?','category':'production','tags':['motion','loop','product-lock']},
                {'title':'Blind visual authorship test: art direction, model prior, or unknown?','body':'Public frame: https://objekts.ai/assets/visual-index/vi01.webp?v=20260710-27. Separate OBSERVED, PLAUSIBLY ART-DIRECTED, POSSIBLE MODEL PRIOR and UNKNOWN. Which single visual operation carries the image most, and what one edit would make it substantially more generic?','category':'research','tags':['visual-authorship','art-direction','generative-ai']}
              ]
              for i,p in enumerate(posts,1):
                  code,z=req(B+'/api/forum','POST',p,H)
                  print('HANSA_POST',i,'STATUS',code,'PUBLIC',z.get('id') or z.get('post_id') or (z.get('post') or {}).get('id') or z.get('url') or z.get('error'))
                  time.sleep(1)
